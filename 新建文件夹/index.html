这里是调整了证书顺序（从初级到高级）后的完整 `index.html` 代码。你可以直接覆盖原有的文件使用。

```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>孙启航 - 个人简历</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #06b6d4;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      --radius: 12px;
      --transition: all 0.2s ease-in-out;
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-blur: blur(10px);
    }

    body.dark-mode {
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --secondary: #22d3ee;
      --bg: #0f172a;
      --surface: #1e293b;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #334155;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -4px rgba(0, 0, 0, 0.2);
      --card-bg: rgba(30, 41, 59, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 80px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    /* 丰富的背景元素 */
    .bg-grid {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        linear-gradient(rgba(37, 99, 235, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37, 99, 235, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -2;
      pointer-events: none;
      transition: background-image 0.3s ease;
    }

    body.dark-mode .bg-grid {
      background-image: 
        linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
    }

    .bg-glow-1, .bg-glow-2, .bg-glow-3 {
      position: fixed;
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
      filter: blur(80px);
      opacity: 0.5;
      transition: opacity 0.3s ease;
    }

    body.dark-mode .bg-glow-1, 
    body.dark-mode .bg-glow-2, 
    body.dark-mode .bg-glow-3 {
      opacity: 0.3;
    }

    .bg-glow-1 {
      top: -10%;
      right: -5%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.15), transparent 70%);
    }

    .bg-glow-2 {
      bottom: 20%;
      left: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.12), transparent 70%);
    }

    .bg-glow-3 {
      top: 40%;
      left: 30%;
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.08), transparent 70%);
    }

    /* 导航栏 */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: rgba(241, 245, 249, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
      transition: var(--transition);
    }

    body.dark-mode .navbar {
      background-color: rgba(15, 23, 42, 0.8);
    }

    .nav-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      height: 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    .nav-links {
      display: flex;
      gap: 24px;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
      transition: var(--transition);
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .nav-actions {
      display: flex;
      gap: 12px;
    }

    .btn-icon {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: var(--transition);
    }

    .btn-icon:hover {
      background-color: var(--border);
      transform: translateY(-1px);
    }

    /* 主体容器 */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }

    section {
      padding: 80px 0 40px;
    }

    /* Hero 区域 */
    .hero {
      min-height: 80vh;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .hero-content {
      max-width: 600px;
      flex: 1;
    }

    .hero-avatar {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-avatar img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--surface);
      box-shadow: var(--shadow-hover);
      transition: var(--transition);
      background-color: var(--border);
    }

    .hero-avatar img:hover {
      transform: scale(1.03);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    .hero h1 {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .objective {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .contact-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .btn-outline {
      background-color: var(--card-bg);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      color: var(--text-main);
      border-color: var(--border);
    }

    .btn-outline:hover {
      background-color: var(--border);
      transform: translateY(-2px);
    }

    /* 亮点成果 */
    .highlights-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .highlight-card {
      background-color: var(--card-bg);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .highlight-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary);
    }

    .highlight-icon {
      font-size: 1.8rem;
      background: rgba(37, 99, 235, 0.1);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      color: var(--primary);
    }

    .highlight-title {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .highlight-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* 通用章节标题 */
    .section-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title::before {
      content: '';
      display: block;
      width: 4px;
      height: 24px;
      background: linear-gradient(to bottom, var(--primary), var(--secondary));
      border-radius: 2px;
    }

    /* Tabs 组件 */
    .tabs-container {
      margin-bottom: 24px;
    }

    .tabs-header {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      overflow-x: auto;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 8px 16px;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 8px 8px 0 0;
      transition: var(--transition);
      white-space: nowrap;
      position: relative;
    }

    .tab-btn:hover {
      color: var(--primary);
      background-color: rgba(37, 99, 235, 0.05);
    }

    .tab-btn[aria-selected="true"] {
      color: var(--primary);
      font-weight: 700;
    }

    .tab-btn[aria-selected="true"]::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: var(--primary);
      border-radius: 2px;
    }

    .tab-panel {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    .tab-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 时间线/卡片列表 */
    .timeline-item {
      background-color: var(--card-bg);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .timeline-item:hover {
      transform: translateX(4px);
      box-shadow: var(--shadow-hover);
      border-left: 4px solid var(--primary);
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }

    .item-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .item-subtitle {
      font-size: 0.95rem;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .item-date {
      font-size: 0.9rem;
      color: var(--text-muted);
      background-color: var(--bg);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .item-list {
      list-style: none;
      margin-top: 12px;
    }

    .item-list li {
      position: relative;
      padding-left: 20px;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .item-list li::before {
      content: '▹';
      position: absolute;
      left: 0;
      color: var(--primary);
      font-weight: bold;
    }

    .item-list li strong {
      color: var(--text-main);
      font-weight: 600;
    }

    /* 技能矩阵 */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }

    .skill-category {
      background-color: var(--card-bg);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .skill-category h3 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill-tag {
      background-color: rgba(37, 99, 235, 0.08);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: var(--transition);
      border: 1px solid transparent;
    }

    .skill-tag:hover {
      background-color: var(--primary);
      color: #ffffff;
      transform: scale(1.05);
    }

    /* 教育经历 */
    .edu-card {
      background-color: var(--card-bg);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      display: flex;
      gap: 24px;
      align-items: flex-start;
      transition: var(--transition);
    }

    .edu-card:hover {
      box-shadow: var(--shadow-hover);
    }

    .edu-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .edu-info h3 {
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    .edu-info .meta {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* 证书网格 */
    .certs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .cert-card {
      background-color: var(--card-bg);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: var(--transition);
      overflow: hidden;
    }

    .cert-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary);
    }

    .cert-img-wrapper {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background-color: var(--bg);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: center;
    }

    .cert-preview {
      width: 100%;
      height: auto;
      max-height: 200px;
      object-fit: contain;
      transition: transform 0.3s ease;
      display: block;
    }

    .cert-preview:hover {
      transform: scale(1.03);
    }

    .cert-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .cert-icon {
      font-size: 1.5rem;
      background: rgba(6, 182, 212, 0.1);
      color: var(--secondary);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .cert-info h4 {
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .cert-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* 图片模态框 (Lightbox) */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal.show {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      max-width: 90%;
      max-height: 85%;
      border-radius: 8px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      object-fit: contain;
      background-color: #fff;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #ffffff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s;
      line-height: 1;
    }

    .modal-close:hover,
    .modal-close:focus {
      color: #bbb;
      text-decoration: none;
      cursor: pointer;
    }

    /* 返回顶部 */
    #back-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      cursor: pointer;
      box-shadow: var(--shadow-hover);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
      z-index: 999;
    }

    #back-to-top.show {
      opacity: 1;
      visibility: visible;
    }

    #back-to-top:hover {
      background-color: var(--primary-hover);
      transform: translateY(-4px);
    }

    /* 页脚 */
    footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }

    /* 提示条 */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: #10b981;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1001;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }
      .hero-container {
        flex-direction: column;
        text-align: center;
        gap: 24px;
      }
      .hero-avatar {
        order: -1;
      }
      .hero h1 {
        font-size: 2.5rem;
      }
      .hero {
        min-height: 60vh;
        padding-top: 100px;
      }
      .objective {
        justify-content: center;
      }
      .contact-buttons {
        justify-content: center;
      }
      .edu-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .item-header {
        flex-direction: column;
      }
      .item-date {
        align-self: flex-start;
      }
      .section-title {
        font-size: 1.5rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* 打印样式 */
    @media print {
      .bg-grid, .bg-glow-1, .bg-glow-2, .bg-glow-3, .modal, #back-to-top, .navbar, .no-print, footer, .tabs-header, .btn, .contact-buttons {
        display: none !important;
      }
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      .container {
        max-width: 100%;
        padding: 0;
      }
      section {
        padding: 20px 0;
        page-break-inside: avoid;
      }
      .tab-panel {
        display: block !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .timeline-item, .highlight-card, .skill-category, .edu-card, .cert-card {
        box-shadow: none !important;
        border: 1px solid #ccc !important;
        page-break-inside: avoid;
        background-color: #ffffff !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        color: #000000 !important;
      }
      .hero h1 {
        -webkit-text-fill-color: #000000 !important;
        color: #000000 !important;
        background: none !important;
      }
      .hero-avatar img {
        border: 1px solid #ccc !important;
      }
      .item-list li::before {
        color: #000000 !important;
      }
      .skill-tag {
        border: 1px solid #ccc !important;
        background: none !important;
        color: #000000 !important;
      }
      .item-date {
        border: 1px solid #ccc !important;
        background: none !important;
      }

          tab.addEventListener('click', () => activateTab(tabs, tab));
          tab.addEventListener('keydown', (e) => {
            let newIndex = index;
            if (e.key === 'ArrowRight') {
              newIndex = (index + 1) % tabs.length;
            } else if (e.key === 'ArrowLeft') {
              newIndex = (index - 1 + tabs.length) % tabs.length;
            } else {
              return;
            }
            e.preventDefault();
            tabs[newIndex].focus();
            activateTab(tabs, tabs[newIndex]);
          });
        });
      });
    }

    function activateTab(tabs, activeTab) {
      tabs.forEach(tab => {
        const isActive = tab === activeTab;
        tab.setAttribute('aria-selected', isActive);
        tab.setAttribute('tabindex', isActive ? '0' : '-1');
        
        const panelId = tab.getAttribute('aria-controls');
        const panel = document.getElementById(panelId);
        if (panel) {
          if (isActive) {
            panel.classList.add('active');
          } else {
            panel.classList.remove('active');
          }
        }
      });
    }

    // ==================== 主题切换 ====================
    function initTheme() {
      const toggleBtn = document.getElementById('theme-toggle');
      if (!toggleBtn) return;

      const currentTheme = localStorage.getItem('theme');
      if (currentTheme === 'dark') {
        document.body.classList.add('dark-mode');
        toggleBtn.textContent = '☀️ 日间';
      }

      toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        toggleBtn.textContent = isDark ? '☀️ 日间' : '🌙 夜间';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
    }

    // ==================== 返回顶部 & 滚动动画 ====================
    function initScroll() {
      const backToTopBtn = document.getElementById('back-to-top');
      if (backToTopBtn) {
        window.addEventListener('scroll', () => {
          if (window.scrollY > 300) {
            backToTopBtn.classList.add('show');
          } else {
            backToTopBtn.classList.remove('show');
          }
        });

        backToTopBtn.addEventListener('click', () => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      // 简单的进入动画
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.style.opacity = '1';
            entry.target.style.transform = 'translateY(0)';
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('section').forEach(section => {
        section.style.opacity = '0';
        section.style.transform = 'translateY(20px)';
        section.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        observer.observe(section);
      });
    }
